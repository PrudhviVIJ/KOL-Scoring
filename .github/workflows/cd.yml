name: KOL Ranking - CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests tqdm pytest

      - name: Run PubMed extraction
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m src.extraction.pubmed

      - name: Run NIH extraction
        run: python -m src.extraction.nih

      - name: Run ClinicalTrials.gov extraction
        run: python -m src.extraction.clinical_trials

      - name: Run pipeline
        run: python -m src.pipeline

      - name: Upload ranking artifact
        uses: actions/upload-artifact@v4
        with:
          name: kol-ranking-output
          path: outputs/ranking/KOL_Ranking.xlsx
